<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brawl Stars</title>

    <!-- iOS Safari Smart App Banner -->
    <meta name="apple-itunes-app" content="app-id=1229016807">

    <meta name="theme-color" content="#111827">
    <meta name="description" content="Discover Brawl Stars!">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, sans-serif;
            background: linear-gradient(135deg, #10172a, #253c67);
            color: white;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
        }

        .container {
            max-width: 500px;
        }

        .logo {
            width: 130px;
            height: 130px;
            border-radius: 28px;
            margin-bottom: 25px;
            object-fit: cover;
        }

        h1 {
            font-size: 42px;
            font-weight: 900;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        p {
            color: #cbd5e1;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #ffcc00;
            color: #172033;
            text-decoration: none;
            font-weight: 800;
            padding: 15px 35px;
            border-radius: 12px;
            transition: transform 0.2s;
        }

        .button:hover {
            transform: scale(1.05);
        }

        .footer {
            margin-top: 45px;
            font-size: 12px;
            color: #94a3b8;
        }
    </style>
</head>

<body>

    <div class="container">

        <img
            class="logo"
            src="https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/placeholder"
            alt="Brawl Stars icon"
        >

        <h1>BRAWL STARS</h1>

        <p>
            Enter the world of Brawl Stars.
            Battle with friends, unlock characters,
            and become a champion!
        </p>

        <a
            class="button"
            href="https://apps.apple.com/app/id1229016807"
        >
            DOWNLOAD ON APP STORE
        </a>

        <div class="footer">
            Brawl Stars · Official App Store Listing
        </div>

    </div>

</body>
</html>
